name: Build hdtSMP64 v4.1.1 + contact bridge (AVX2 + PDB)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout this repo (bridge_core + patch)
        uses: actions/checkout@v4

      - name: Clone upstream hdtSMP64 v4.1.1 (with submodules)
        shell: bash
        run: |
          git clone --branch v4.1.1 --depth 1 https://github.com/DaymareOn/hdtSMP64.git hdtSMP64
          cd hdtSMP64
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive

      - name: Apply contact bridge patch
        shell: bash
        run: |
          cd hdtSMP64
          git apply --ignore-whitespace --whitespace=nowarn -p1 ../patch/FSMP_v4.1.1_contact_bridge.patch
          git status --short

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-avx2-${{ hashFiles('patch/**') }}
          restore-keys: vcpkg-avx2-

      - name: Configure (preset vs2022-windows-avx2)
        shell: pwsh
        working-directory: hdtSMP64
        run: |
          $cache = "$env:LOCALAPPDATA\vcpkg\archives"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$cache,readwrite"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/out/plugins/SKSE/Plugins" | Out-Null
          cmake --preset vs2022-windows-avx2 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DCompiledPluginsPath="${{ github.workspace }}/out/plugins"

      - name: Build
        shell: pwsh
        working-directory: hdtSMP64
        run: cmake --build out/build/vs2022-windows-avx2 --config Release

      - name: Collect DLL + PDB (must come from the same build)
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/dist/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $dll = Get-ChildItem -Path "${{ github.workspace }}/hdtSMP64/out/build/vs2022-windows-avx2" -Recurse -Filter hdtsmp64.dll | Where-Object { $_.FullName -match 'Release' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Path "${{ github.workspace }}/out/plugins" -Recurse -Filter hdtsmp64.dll | Select-Object -First 1 }
          if (-not $dll) { Write-Error "hdtSMP64.dll not found"; exit 1 }
          $pdb = Join-Path $dll.DirectoryName "hdtsmp64.pdb"
          if (-not (Test-Path $pdb)) {
            $pdb = (Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter hdtsmp64.pdb | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          }
          if (-not $pdb -or -not (Test-Path $pdb)) { Write-Error "hdtsmp64.pdb not found"; exit 1 }
          Write-Host "DLL: $($dll.FullName)"
          Write-Host "PDB: $pdb ($([math]::Round((Get-Item $pdb).Length/1MB,1)) MB)"
          Copy-Item $dll.FullName "$dist/hdtSMP64.dll"
          Copy-Item $pdb "$dist/hdtSMP64.pdb"
          $pv = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$dist/hdtSMP64.dll").ProductVersion
          Write-Host "ProductVersion: $pv"
          if ($pv -notmatch "avx2") { Write-Error "Not an AVX2 build"; exit 1 }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("$dist/hdtSMP64.dll"))
          if (-not $text.Contains("GTFSMP_GetContactBridgeV1")) { Write-Error "Bridge export missing"; exit 1 }
          Write-Host "OK: AVX2 + GTFSMP_GetContactBridgeV1 + PDB"

      - name: Upload result (DLL + PDB together)
        uses: actions/upload-artifact@v4
        with:
          name: hdtSMP64-4.1.1-bridge-avx2-with-pdb
          path: dist/
          if-no-files-found: error
